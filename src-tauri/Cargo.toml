[package]
name = "light-pen"
version = "0.4.0-beta.1"
description = "A local Fluent whiteboard"
authors = ["Light Pen"]
license = "MIT"
repository = "https://github.com/unnamed-Light/light-pen"
edition = "2021"

[lib]
name = "light_pen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
base64 = "0.22"
sha2 = "0.10"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
